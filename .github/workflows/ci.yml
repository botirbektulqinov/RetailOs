name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Prisma client is a generated artifact, not committed, so it must
      # exist before anything typechecks.
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retailos
          POSTGRES_PASSWORD: retailos
          POSTGRES_DB: retailos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retailos -d retailos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://retailos:retailos@localhost:5432/retailos_test?schema=public
      JWT_SECRET: ci-secret-value-at-least-thirty-two-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-chars
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: 'false'
      # The auth suite logs in dozens of times from one address. Production
      # limits would throttle the tests, not an attacker.
      AUTH_RATE_LIMIT: '2000'
      RATE_LIMIT_LIMIT: '20000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # `migrate deploy`, never `migrate dev` — CI must apply the committed
      # migrations, not author new ones from schema drift.
      - run: npm run prisma:migrate:deploy
      - run: npm run seed
      - run: npm run test:e2e

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
